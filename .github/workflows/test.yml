name: test

on:
  push:
    branches: [main]
  pull_request:
  workflow_call:
    # A flag that is off unless set: on a push or pull request there are no inputs, and an absent one reads as false.
    inputs:
      skip-coverage-upload:
        description: Run the tests without uploading their coverage to Codecov
        type: boolean
        default: false
    secrets:
      CODECOV_TOKEN:
        required: false

permissions: {}

jobs:
  test:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: leafo/gh-actions-lua@32909a2dea0a48c433aec79e7fcd31b4cd55800f # v13.1.0
        with:
          luaVersion: "5.2"
      - uses: leafo/gh-actions-luarocks@1c4a92caecc8f6850f673cbadfd57b3e555417ce # v6.1.1
      # The "# renovate:" comments tell Renovate where each version comes from (see renovate.json). cluacov is
      # luacov's hook in C: the inflate tests take minutes under the Lua one.
      - name: Install luacov
        run: |
          # renovate: datasource=github-tags depName=lunarmodules/luacov
          luarocks install luacov 0.17.0
          # renovate: datasource=github-tags depName=lunarmodules/cluacov
          luarocks install cluacov 1.0.0
          # renovate: datasource=github-tags depName=daurnimator/luacov-reporter-lcov
          luarocks install luacov-reporter-lcov 0.2
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - name: Install coverage.py
        run: python -m pip install -r requirements-dev.txt
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install istanbul
        run: npm ci --ignore-scripts
      - name: Unit tests
        run: python tools/run_tests.py --coverage
      # The release workflow runs these tests again without uploading.
      - name: Upload coverage
        if: ${{ !inputs.skip-coverage-upload }}
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: unit
          files: coverage/lua.lcov,coverage/python.xml,coverage/js-node/lcov.info
          disable_search: true
          fail_ci_if_error: true
      # Codecov's per-language checks need its Pro plan, so each job holds the languages it measures to 80% itself.
      # JavaScript is held where all of mac.js runs, in the dialogs workflow's dialog-mac job.
      - name: Coverage floors
        run: |
          status=0
          python tools/coverage_gate.py lua coverage/lua.lcov || status=1
          python tools/coverage_gate.py python coverage/python.xml || status=1
          exit $status
