name: dialogs

# The dialog scripts on a real desktop, without Dorico. GitHub's Windows runners have an interactive session, so
# tests/dialog/test_windows_dialog.py can open windows.ps1 and press its buttons through UI Automation. The macOS
# runners let osascript control the computer, so tests/dialog/test_mac_dialog.py does the same with mac.js through
# System Events.
on:
  push:
    branches: [main]
  pull_request:

permissions: {}

jobs:
  dialog-windows:
    runs-on: windows-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      # The tests build each request with the plug-in's own Lua. Lua 5.2 ended at 5.2.4, so this pin never moves.
      - name: Install Lua 5.2
        run: choco install lua52 --version 5.2.4 -y --no-progress
      # The "# renovate:" comment tells Renovate where the version comes from (see renovate.json).
      - name: Install Pester
        shell: powershell
        run: |
          # renovate: datasource=nuget depName=Pester registryUrl=https://www.powershellgallery.com/api/v2/
          Install-Module Pester -RequiredVersion 6.2.0 -Scope CurrentUser -Force -SkipPublisherCheck
      - name: Dialog tests
        shell: powershell
        run: |
          $env:HBUC_PS_COVERAGE = Join-Path $PWD "coverage\ps"
          New-Item -ItemType Directory -Force $env:HBUC_PS_COVERAGE | Out-Null
          python tests/dialog/test_windows_dialog.py -v
          exit $LASTEXITCODE
      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: dialog-windows
          directory: coverage/ps
          fail_ci_if_error: true

  dialog-mac:
    runs-on: macos-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0 # v7.1.0
        with:
          python-version: "3.12"
      - uses: leafo/gh-actions-lua@32909a2dea0a48c433aec79e7fcd31b4cd55800f # v13.1.0
        with:
          luaVersion: "5.2"
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: "24"
      - name: Install istanbul
        run: npm ci --ignore-scripts
      - name: Dialog tests
        env:
          HBUC_JS_COVERAGE: ${{ runner.temp }}/js-mac
          HBUC_SCREENSHOTS: ${{ runner.temp }}/screenshots
        run: |
          mkdir -p "$HBUC_JS_COVERAGE" "$HBUC_SCREENSHOTS"
          python tests/dialog/test_mac_dialog.py -v
      - name: Merge coverage
        run: node tests/dialog/mac_coverage.js "$RUNNER_TEMP/js-mac" coverage/js-mac
      - name: Upload coverage
        uses: codecov/codecov-action@303a32d7a59b442fa8d48b6a1cc6825c09c847a5 # v7.1.1
        with:
          token: ${{ secrets.CODECOV_TOKEN }}
          flags: dialog-mac
          files: coverage/js-mac/lcov.info
          disable_search: true
          fail_ci_if_error: true
      - name: Keep the screenshots of failed steps
        if: failure()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: dialog-mac-screenshots
          path: ${{ runner.temp }}/screenshots
          if-no-files-found: ignore
